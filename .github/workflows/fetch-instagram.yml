name: Fetch Instagram Posts

on:
  schedule:
    # 毎日 日本時間 午前3時（UTC 18:00）に実行
    - cron: '0 18 * * *'
  workflow_dispatch: # 手動実行を許可

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Instagram posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          set -e
          # Instagram Graph API から最新12投稿を取得
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://graph.facebook.com/v18.0/${INSTAGRAM_BUSINESS_ACCOUNT_ID}/media?fields=id,caption,media_type,media_url,thumbnail_url,permalink,timestamp&limit=12&access_token=${INSTAGRAM_ACCESS_TOKEN}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Instagram API returned HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          # JSONに整形して保存
          echo "$BODY" | jq --arg now "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" '{
            updated_at: $now,
            posts: [.data[] | {
              id: .id,
              caption: (.caption // ""),
              media_type: .media_type,
              media_url: .media_url,
              thumbnail_url: (.thumbnail_url // .media_url),
              permalink: .permalink,
              timestamp: .timestamp
            }]
          }' > data/instagram.json

          echo "Fetched $(jq '.posts | length' data/instagram.json) posts"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Instagram posts [skip ci]"
            git push
          fi

      - name: Refresh long-lived token (on 50th day)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          # トークンの有効期限をチェック
          DEBUG_RESPONSE=$(curl -s "https://graph.facebook.com/debug_token?input_token=${INSTAGRAM_ACCESS_TOKEN}&access_token=${INSTAGRAM_ACCESS_TOKEN}")
          EXPIRES_AT=$(echo "$DEBUG_RESPONSE" | jq -r '.data.expires_at // 0')
          NOW=$(date +%s)
          DAYS_LEFT=$(( (EXPIRES_AT - NOW) / 86400 ))

          echo "Token expires in $DAYS_LEFT days"

          if [ "$DAYS_LEFT" -lt 10 ] && [ "$DAYS_LEFT" -gt 0 ]; then
            echo "::warning::Access token expires in $DAYS_LEFT days. Please refresh it manually."
            echo "See: drive-outputs/instagram-integration-setup-guide.md"
          fi
